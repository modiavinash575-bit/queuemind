<style>

ground:rgba(239,68,68,.1)}.info{color:#a9e4ff;background:rgba(56,189,248,.1)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:27px 0 13px}.section-head h2{font-size:20px;letter-spacing:-.5px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.forecast-grid{display:grid;grid-template-columns:380px 1fr;gap:17px}.control{margin-bottom:18px}.control-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.control label{font-size:11px;font-weight:800}.control output{font-size:11px;color:var(--blue2);font-weight:900}.range{appearance:none;width:100%;height:4px;background:#29364a;border-radius:999px;outline:none}.range::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:#eefaff;border:4px solid var(--blue);box-shadow:0 2px 10px rgba(56,189,248,.35);cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#b7c2d3;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer}.chip:hover,.chip.active{color:#dff5ff;border-color:rgba(56,189,248,.23);background:rgba(56,189,248,.09)}.risk-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:18px;padding:15px 17px;margin-bottom:13px}.risk-banner.rhigh{background:linear-gradient(90deg,rgba(239,68,68,.12),rgba(239,68,68,.025))}.risk-banner.rmed{background:linear-gradient(90deg,rgba(245,158,11,.12),rgba(245,158,11,.025))}.risk-banner.rlow{background:linear-gradient(90deg,rgba(34,197,94,.1),rgba(34,197,94,.025))}.risk-banner strong{font-size:15px}.risk-banner span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.results{display:grid;grid-template-columns:1fr 1fr;gap:11px}.result{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:17px;padding:16px}.result .label{font-size:10px;color:var(--muted);font-weight:800}.result .value{font-size:26px;font-weight:900;letter-spacing:-.7px;margin:6px 0 2px}.result .note{font-size:10px;color:var(--muted);line-height:1.45}.chart-wrap{height:285px;margin-top:7px}.chart-svg{width:100%;height:100%;overflow:visible}.chart-grid line{stroke:rgba(255,255,255,.07);stroke-width:1}.axis{font-size:10px;fill:#70809a}.line-a,.line-b{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line-a{stroke:#ef4444}.line-b{stroke:#38bdf8}.area-a{fill:url(#ga)}.area-b{fill:url(#gb)}.legend{display:flex;gap:11px;font-size:9px;color:var(--muted)}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.legend .a i{background:#ef4444}.legend .b i{background:#38bdf8}.action{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.action:last-child{border:0}.num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--blue2);font-size:10px;font-weight:900;background:rgba(56,189,248,.08)}.action .copy{flex:1}.action strong{font-size:12px;display:block}.action span{font-size:10px;color:var(--muted)}.notice{border:1px solid rgba(56,189,248,.14);background:rgba(56,189,248,.055);border-radius:14px;padding:12px 13px;color:#c5dfef;font-size:10px;line-height:1.6}.xai{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.xai:last-child{border:0}.xai .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(56,189,248,.08);color:var(--blue2);font-size:10px;font-weight:900}.xai h3{font-size:12px;margin:2px 0 5px}.xai p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:#cbd8e8;padding:11px 12px;background:#08111d;border:1px solid var(--line);border-radius:11px;margin-top:8px;overflow:auto}.layers{display:flex;flex-direction:column;gap:9px}.layer{display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:13px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:15px;padding:14px;cursor:pointer;transition:.18s}.layer:hover,.layer.active{border-color:rgba(56,189,248,.22);background:rgba(56,189,248,.05)}.layer .ln{font-size:10px;color:var(--blue2);font-weight:900}.layer h3{font-size:12px;margin:0 0 3px}.layer p{font-size:10px;color:var(--muted);margin:0}.layer-detail{display:none;color:var(--muted);font-size:11px;line-height:1.65;padding:11px 15px 5px 59px}.layer.active + .layer-detail{display:block}.setting{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting strong{font-size:12px}.setting p{font-size:10px;color:var(--muted);margin:4px 0 0}.toggle{width:44px;height:24px;border-radius:999px;background:#28364a;padding:3px;cursor:pointer}.toggle:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on:after{transform:translateX(20px)}select,input.text{background:#08131f;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:#edf7ff;font-size:10px;outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.table th{color:var(--muted);font-weight:800}.empty{text-align:center;color:var(--muted);padding:30px}.donut{width:174px;height:174px;border-radius:50%;display:grid;place-items:center;margin:auto}.donut-center{width:112px;height:112px;border-radius:50%;background:#0c1727;display:grid;place-items:center;text-align:center}.donut-center strong{font-size:26px}.donut-center span{display:block;font-size:8px;color:var(--muted);letter-spacing:.1em}.bars{height:220px;display:flex;align-items:end;gap:26px;padding:12px 25px 25px}.barbox{flex:1;text-align:center}.bar{border-radius:12px 12px 5px 5px;min-height:8px}.barbox strong{display:block;font-size:10px;margin-top:8px}.barbox span{font-size:9px;color:var(--muted)}.mobile-top,.mobile-nav{display:none}.toast{position:fixed;right:22px;bottom:22px;z-index:100;background:#101f31;border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:14px;padding:11px 14px;font-size:11px;font-weight:800;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.forecast-grid{grid-template-columns:1fr}}
@media(max-width:780px){:root{--sidebar:0px}.app{display:block}.sidebar,.topbar{display:none}.mobile-top{display:flex;position:sticky;top:0;z-index:40;height:58px;align-items:center;justify-content:space-between;padding:0 15px;background:rgba(7,16,27,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.mobile-top .brand{padding:0}.content{padding:18px 16px 92px}.g4,.g3,.g2,.results{grid-template-columns:1fr}.hero-main{padding:25px}.hero h1{font-size:34px}.mobile-nav{display:flex;position:fixed;z-index:50;left:12px;right:12px;bottom:12px;height:59px;border-radius:18px;border:1px solid var(--line);background:rgba(11,23,38,.92);backdrop-filter:blur(20px);box-shadow:var(--shadow);align-items:center;justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:#8fa0b8;font-size:8px;display:flex;flex-direction:column;align-items:center;gap:3px}.mobile-nav button.active{color:#fff}.mobile-nav svg{width:17px;height:17px}.metric-big{font-size:44px}}

<div class="mobile-top"><div class="brand"><div class="logo"></div><div><b>QueueMind</b><small>Flow Intelligence</small></div></div><button class="btn2" data-go="settings">Settings</button></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo"></div><div><b>QueueMind</b><small>Flow Intelligence</small></div></div>
    <div class="nav-label">Workspace</div>

  <main class="main">

<script>
(function(){
'use strict';
const defaults={queue:70,arrivals:45,food:80,rate:2.5,counters:2,horizon:15,riskMultiplier:1.3,targetWait:10,autoRun:true};
const icons={
overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
forecast:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>',
analytics:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h16"/><path d="M7 16V9M12 16V4M17 16v-6"/></svg>',
explain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 0 1 5.1 1.2c0 2-2.6 2.2-2.6 4"/><path d="M12 18h.01"/></svg>',
architecture:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/></svg>',
settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1-2.8 2.8-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21h-4v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1-2.8-2.8.1-.1A1.6 1.6 0 0 0 4.8 15a1.6 1.6 0 0 0-1.5-1H3v-4h.3a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1 2.8-2.8.1.1a1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5V3h4v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1 2.8 2.8-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1h.3v4h-.3a1.6 1.6 0 0 0-1.5 1Z"/></svg>'};
const pages=[['overview','Operational Overview'],['forecast','Live Forecast'],['analytics','Analytics'],['explain','AI Explanation'],['architecture','Architecture'],['settings','Settings']];
const LS={get(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function settings(){return {...defaults,...LS.get('qm-settings',{})}}
function saveSettings(p){LS.set('qm-settings',{...settings(),...p})}
function history(){return LS.get('qm-history',[])}
function latest(){return LS.get('qm-latest',simulate(defaults,false))}
function simulate(input={},saveLatest=false){const s={...settings(),...input};const queue=+s.queue,arrivals=+s.arrivals,food=+s.food,rate=+s.rate,counters=+s.counters,horizon=+s.horizon||15;const totalLoad=queue+arrivals,currentCapacity=counters*rate*horizon,foodDeficit=Math.max(0,Math.ceil(totalLoad-food)),recCounters=Math.max(1,Math.ceil(totalLoad/(rate*horizon))),optimizedCapacity=recCounters*rate*horizon,currentWait=Math.max(0,Math.round(queue/(counters*rate))),optimizedWait=Math.max(0,Math.round(queue/(recCounters*rate)));let risk='LOW',tone='low',rt='Flow is within current operating capacity.';if(totalLoad>currentCapacity*(+s.riskMultiplier||1.3)){risk='HIGH';tone='high';rt='Demand exceeds '+horizon+'-minute capacity by '+Math.round(((totalLoad-currentCapacity)/currentCapacity)*100)+'%.'}else if(totalLoad>currentCapacity){risk='MODERATE';tone='med';rt='Throughput is near maximum capacity. Queue accumulation is likely.'}const intervals=[0,3,6,9,12,15].filter(x=>x<=horizon);if(intervals[intervals.length-1]!==horizon)intervals.push(horizon);const apm=arrivals/horizon;const unoptimized=intervals.map(t=>Math.max(0,Math.round(queue+apm*t-counters*rate*t)));const optimized=intervals.map(t=>Math.max(0,Math.round(queue+apm*t-recCounters*rate*t)));const r={...s,totalLoad,currentCapacity,foodDeficit,recCounters,optimizedCapacity,currentWait,optimizedWait,risk,tone,riskText:rt,intervals,unoptimized,optimized,timestamp:new Date().toISOString()};if(saveLatest)LS.set('qm-latest',r);return r}
function saveRun(r){LS.set('qm-latest',r);const h=history();h.unshift(r);LS.set('qm-history',h.slice(0,25));toast('Forecast saved to Analytics')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function fmt(ts){return new Date(ts).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function avg(h,k){return h.length?Math.round(h.reduce((a,x)=>a+(+x[k]||0),0)/h.length):0}
function drawChart(el,r){if(!el)return;const W=860,H=270,P={l:37,r:15,t:14,b:30};const vals=[...r.unoptimized,...r.optimized],max=Math.max(20,...vals);const x=i=>P.l+i*((W-P.l-P.r)/(r.intervals.length-1)),y=v=>H-P.b-(v/max)*(H-P.t-P.b);const path=d=>d.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');const area=d=>path(d)+' L '+x(d.length-1)+','+(H-P.b)+' L '+x(0)+','+(H-P.b)+' Z';let grid='',labels='';for(let i=0;i<5;i++){const yy=P.t+i*((H-P.t-P.b)/4),v=Math.round(max-(max*i/4));grid+='<line x1="'+P.l+'" y1="'+yy+'" x2="'+(W-P.r)+'" y2="'+yy+'"/><text class="axis" x="2" y="'+(yy+3)+'">'+v+'</text>'}r.intervals.forEach((v,i)=>labels+='<text class="axis" text-anchor="middle" x="'+x(i)+'" y="'+(H-7)+'">'+v+'m</text>');el.innerHTML='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444" stop-opacity=".18"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><g class="chart-grid">'+grid+'</g>'+labels+'<path class="area-a" d="'+area(r.unoptimized)+'"/><path class="area-b" d="'+area(r.optimized)+'"/><path class="line-a" d="'+path(r.unoptimized)+'"/><path class="line-b" d="'+path(r.optimized)+'"/></svg>'}
function nav(){const s=document.getElementById('sideNav'),m=document.getElementById('mobileNav');s.innerHTML=pages.map(([id,label])=>'<button data-page="'+id+'">'+icons[id]+'<span>'+label+'</span></button>').join('');m.innerHTML=pages.slice(0,5).map(([id,label])=>'<button data-page="'+id+'">'+icons[id]+'<span>'+label.split(' ')[0]+'</span></button>').join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-go]');if(b)show(b.dataset.page||b.dataset.go)})}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));const p=pages.find(x=>x[0]===id);document.getElementById('topTitle').textContent=p?p[1]:'QueueMind';if(id==='overview')renderOverview();if(id==='analytics')renderAnalytics();if(id==='explain')renderExplain();if(id==='settings')renderSettings();window.scrollTo({top:0,behavior:'smooth'})}
function renderOverview(){const r=latest(),h=history();const el=document.getElementById('view-overview');el.innerHTML='<div class="hero"><div class="hero-main"><div class="eyebrow">Canteen Operations Intelligence</div><h1>See the rush before the queue forms.</h1><p>QueueMind combines current queue pressure, expected arrivals, service capacity and food availability to recommend exactly what the canteen team should do over the next '+r.horizon+' minutes.</p><div class="hero-buttons"><button class="btn" data-go="forecast">Run live forecast</button><button class="btn2" data-go="explain">See how decisions are made</button></div></div><div class="hero-side"><div><div class="metric-label">Current operating risk</div><div class="metric-big">'+r.risk+'</div><div class="sub">'+r.riskText+'</div></div><span class="badge '+r.tone+'">'+r.totalLoad+' projected students</span></div></div><div class="grid g4"><div class="card hover"><div class="subtitle">Current queue</div><div class="stat">'+r.queue+'</div><div class="stat-foot">students waiting now</div></div><div class="card hover"><div class="subtitle">Expected arrivals</div><div class="stat">'+r.arrivals+'</div><div class="stat-foot">next '+r.horizon+' minutes</div></div><div class="card hover"><div class="subtitle">Recommended counters</div><div class="stat">'+r.recCounters+'</div><div class="stat-foot">current: '+r.counters+'</div></div><div class="card hover"><div class="subtitle">Optimized wait</div><div class="stat">'+r.optimizedWait+'<span style="font-size:13px;color:var(--muted)"> min</span></div><div class="stat-foot">from '+r.currentWait+' min baseline</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><div class="card-head"><div><div class="title">Queue movement preview</div><div class="subtitle">Current staffing vs QueueMind recommendation</div></div><div class="legend"><span class="a"><i></i>Current</span><span class="b"><i></i>Optimized</span></div></div><div id="overviewChart" class="chart-wrap"></div></div><div class="card"><div class="title">Recommended next actions</div><div class="action"><div class="num">01</div><div class="copy"><strong>'+(r.recCounters>r.counters?'Open '+(r.recCounters-r.counters)+' additional counter(s)':'Maintain current counter setup')+'</strong><span>Recommended total: '+r.recCounters+' counter(s)</span></div></div><div class="action"><div class="num">02</div><div class="copy"><strong>'+(r.foodDeficit?'Prepare '+r.foodDeficit+' extra portions':'Food stock is sufficient')+'</strong><span>Projected demand: '+r.totalLoad+' portions</span></div></div><div class="action"><div class="num">03</div><div class="copy"><strong>Monitor the next '+r.horizon+' minutes</strong><span>Expected wait after action: ~'+r.optimizedWait+' min</span></div></div><button class="btn2" data-go="forecast" style="width:100%;margin-top:13px">Adjust live inputs</button></div></div>';
drawChart(document.getElementById('overviewChart'),r)}
function renderForecast(){const el=document.getElementById('view-forecast');el.innerHTML='<div class="section-head" style="margin-top:0"><div><h2>Live canteen simulator</h2><p>Change operating conditions and the model recalculates instantly.</p></div><div class="chips"><button class="chip" data-preset="rush">Rush hour</button><button class="chip" data-preset="moderate">Moderate</button><button class="chip" data-preset="lowfood">Low stock</button><button class="chip" data-preset="event">Event surge</button></div></div><div class="forecast-grid"><div class="card"><div class="card-head"><div><div class="title">Operating inputs</div><div class="subtitle">Current state + next 15 minutes</div></div><span class="badge info">Interactive</span></div>'+[['q','Current queue','0','200','1','70',' students'],['a','Expected arrivals','0','150','1','45',' students'],['f','Food available','0','250','1','80',' portions'],['r','Service rate / counter','1','10','.5','2.5',' / min'],['c','Active counters','1','6','1','2',' counters']].map(x=>'<div class="control"><div class="control-top"><label>'+x[1]+'</label><output id="o'+x[0]+'"></output></div><input id="'+x[0]+'" class="range" type="range" min="'+x[2]+'" max="'+x[3]+'" step="'+x[4]+'" value="'+x[5]+'" data-suffix="'+x[6]+'"></div>').join('')+'<button id="saveForecast" class="btn" style="width:100%;padding:12px">Save forecast run</button><div class="notice" style="margin-top:12px">Saved runs stay on this device and appear in Analytics. No internet connection is used.</div></div><div><div id="riskBanner" class="risk-banner"></div><div class="results"><div class="result"><div class="label">Recommended counters</div><div class="value" id="resCounters"></div><div class="note" id="resCountersNote"></div></div><div class="result"><div class="label">Projected current wait</div><div class="value" id="resWait"></div><div class="note" id="resWaitNote"></div></div><div class="result"><div class="label">Food deficit</div><div class="value" id="resFood"></div><div class="note" id="resFoodNote"></div></div><div class="result"><div class="label">Optimized capacity</div><div class="value" id="resCap"></div><div class="note">students / forecast window</div></div></div><div class="card" style="margin-top:12px"><div class="card-head"><div><div class="title">15-minute queue projection</div><div class="subtitle">Before vs after recommended staffing</div></div><div class="legend"><span class="a"><i></i>Current</span><span class="b"><i></i>Optimized</span></div></div><div id="forecastChart" class="chart-wrap"></div></div></div></div>';
const ids=['q','a','f','r','c'],ps={rush:[70,45,80,2.5,2],moderate:[20,15,120,2.5,2],lowfood:[35,40,35,3,2],event:[110,90,160,2.5,3]};let current;function calc(){ids.forEach(id=>document.getElementById('o'+id).textContent=document.getElementById(id).value+document.getElementById(id).dataset.suffix);current=simulate({queue:+q.value,arrivals:+a.value,food:+f.value,rate:+r.value,counters:+c.value},true);const rb=document.getElementById('riskBanner');rb.className='risk-banner r'+current.tone;rb.innerHTML='<div><strong>'+current.risk+' RISK</strong><span>'+current.riskText+'</span></div><span class="badge '+current.tone+'">'+(current.risk==='HIGH'?'Action needed':current.risk==='MODERATE'?'Watch closely':'Stable')+'</span>';resCounters.textContent=current.recCounters;resCountersNote.textContent=current.recCounters>current.counters?'Open +'+(current.recCounters-current.counters)+' counter(s) now.':'Current setup is sufficient.';resWait.textContent=current.currentWait+' min';resWaitNote.textContent='Optimized: ~'+current.optimizedWait+' min.';resFood.textContent=current.foodDeficit;resFoodNote.textContent=current.foodDeficit?'additional portions required':'stock is sufficient';resCap.textContent=Math.round(current.optimizedCapacity);drawChart(document.getElementById('forecastChart'),current)}ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const v=ps[b.dataset.preset];ids.forEach((id,i)=>document.getElementById(id).value=v[i]);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('active'));b.classList.add('active');calc()});document.getElementById('saveForecast').onclick=()=>saveRun({...current,timestamp:new Date().toISOString()});calc()}
function renderAnalytics(){const h=history(),el=document.getElementById('view-analytics'),aw=avg(h,'currentWait'),ao=avg(h,'optimizedWait'),al=avg(h,'totalLoad'),high=h.filter(x=>x.risk==='HIGH').length,latestRun=h[0]||latest(),dist={LOW:h.filter(x=>x.risk==='LOW').length,MODERATE:h.filter(x=>x.risk==='MODERATE').length,HIGH:h.filter(x=>x.risk==='HIGH').length},total=Math.max(1,h.length),p1=dist.LOW/total*100,p2=(dist.LOW+dist.MODERATE)/total*100;el.innerHTML='<div class="section-head" style="margin-top:0"><div><h2>Operational analytics</h2><p>History from forecast runs saved on this device.</p></div><div class="actions"><button id="demoHistory" class="btn2">Load demo history</button><button id="clearHistory" class="danger">Clear history</button></div></div><div class="grid g4"><div class="card"><div class="subtitle">Average queue load</div><div class="stat">'+al+'</div><div class="stat-foot">students / run</div></div><div class="card"><div class="subtitle">Average current wait</div><div class="stat">'+aw+'<span style="font-size:13px;color:var(--muted)"> min</span></div><div class="stat-foot">before optimization</div></div><div class="card"><div class="subtitle">Average optimized wait</div><div class="stat">'+ao+'<span style="font-size:13px;color:var(--muted)"> min</span></div><div class="stat-foot">'+Math.max(0,aw-ao)+' min average improvement</div></div><div class="card"><div class="subtitle">High-risk runs</div><div class="stat">'+high+'</div><div class="stat-foot">of '+h.length+' saved forecasts</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><div class="title">Demand vs optimized capacity</div><div class="bars"><div class="barbox"><div class="bar" style="height:'+Math.min(175,latestRun.totalLoad*1.2)+'px;background:#38bdf8"></div><strong>Demand</strong><span>'+latestRun.totalLoad+'</span></div><div class="barbox"><div class="bar" style="height:'+Math.min(175,latestRun.optimizedCapacity*1.2)+'px;background:#22c55e"></div><strong>Capacity</strong><span>'+Math.round(latestRun.optimizedCapacity)+'</span></div></div></div><div class="card"><div class="title">Risk distribution</div><div style="height:220px;display:grid;place-items:center"><div class="donut" style="background:conic-gradient(#22c55e 0 '+p1+'%,#f59e0b '+p1+'% '+p2+'%,#ef4444 '+p2+'% 100%)"><div class="donut-center"><div><strong>'+h.length+'</strong><span>TOTAL RUNS</span></div></div></div></div></div></div><div class="section-head"><div><h2>Saved forecast runs</h2><p>Most recent runs appear first.</p></div><button class="btn2" data-go="forecast">Create new run</button></div><div class="card table-wrap">'+(h.length?'<table class="table"><thead><tr><th>Time</th><th>Load</th><th>Risk</th><th>Counters</th><th>Food deficit</th><th>Wait</th><th>Optimized</th></tr></thead><tbody>'+h.map(x=>'<tr><td>'+fmt(x.timestamp)+'</td><td>'+x.totalLoad+'</td><td><span class="badge '+x.tone+'">'+x.risk+'</span></td><td>'+x.counters+' → '+x.recCounters+'</td><td>'+x.foodDeficit+'</td><td>'+x.currentWait+' min</td><td>'+x.optimizedWait+' min</td></tr>').join('')+'</tbody></table>':'<div class="empty">No saved runs yet. Save a forecast to populate analytics.</div>')+'</div>';document.getElementById('clearHistory').onclick=()=>{LS.set('qm-history',[]);renderAnalytics();toast('History cleared')};document.getElementById('demoHistory').onclick=()=>{const demo=[[18,22,80,3,2],[26,30,95,3,2],[44,40,90,2.5,2],[62,48,85,2.5,2],[78,60,100,2.5,2],[40,25,120,3,3]].map((v,i)=>{const r=simulate({queue:v[0],arrivals:v[1],food:v[2],rate:v[3],counters:v[4]},false);r.timestamp=new Date(Date.now()-(6-i)*3600000).toISOString();return r}).reverse();LS.set('qm-history',demo);renderAnalytics();toast('Demo history loaded')}}
function renderExplain(){const r=latest(),el=document.getElementById('view-explain');el.innerHTML='<div class="hero"><div class="hero-main"><div class="eyebrow">Explainable Decision Logic</div><h1>Every recommendation has a reason.</h1><p>QueueMind exposes the calculations behind each recommendation so staff can understand the output rather than trusting a black box.</p><div class="hero-buttons"><button class="btn" data-go="forecast">Change scenario</button><button class="btn2">Latest run · '+fmt(r.timestamp)+'</button></div></div><div class="hero-side"><div><div class="metric-label">Latest risk classification</div><div class="metric-big" style="font-size:42px">'+r.risk+'</div><div class="sub">'+r.riskText+'</div></div><span class="badge '+r.tone+'">'+r.totalLoad+' projected students</span></div></div><div class="grid g2"><div class="card"><div class="title">Decision trace</div><div class="subtitle">From raw inputs to staff action</div><div class="xai"><div class="n">01</div><div><h3>Estimate total demand</h3><p>Current queue '+r.queue+' + expected arrivals '+r.arrivals+' = <strong>'+r.totalLoad+' students</strong>.</p><div class="formula">totalLoad = currentQueue + expectedArrivals</div></div></div><div class="xai"><div class="n">02</div><div><h3>Measure present capacity</h3><p>'+r.counters+' counters × '+r.rate+' students/min × '+r.horizon+' min = <strong>'+Math.round(r.currentCapacity)+' students</strong>.</p><div class="formula">capacity = counters × serviceRate × horizon</div></div></div><div class="xai"><div class="n">03</div><div><h3>Classify crowd risk</h3><p>Projected demand is compared against current capacity and the high-risk threshold.</p><div class="formula">HIGH if load &gt; capacity × '+r.riskMultiplier+'; MODERATE if load &gt; capacity; else LOW</div></div></div><div class="xai"><div class="n">04</div><div><h3>Choose counter requirement</h3><p>The smallest whole number that can cover demand is <strong>'+r.recCounters+' counters</strong>.</p><div class="formula">recommendedCounters = ceil(totalLoad ÷ (serviceRate × horizon))</div></div></div><div class="xai"><div class="n">05</div><div><h3>Check food readiness</h3><p>Food stock '+r.food+' is compared with demand '+r.totalLoad+'. <strong>'+(r.foodDeficit?r.foodDeficit+' more portions are required':'Stock is sufficient')+'.</strong></p></div></div></div><div><div class="card"><div class="card-head"><div><div class="title">Human-readable recommendation</div><div class="subtitle">The output staff actually needs</div></div><span class="badge '+r.tone+'">'+r.risk+'</span></div><div class="notice">'+(r.recCounters>r.counters?'Open '+(r.recCounters-r.counters)+' additional counter(s) now. ':'Maintain the current counter setup. ')+(r.foodDeficit?'Prepare '+r.foodDeficit+' extra portions. ':'No extra food batch is required. ')+'Applying the recommended staffing changes projected wait from about '+r.currentWait+' minutes to '+r.optimizedWait+' minutes.</div></div><div class="card" style="margin-top:16px"><div class="title">Where AI fits</div><p class="sub" style="line-height:1.7">The current working model uses transparent forecasting equations for its live demo. In a production version, historical canteen data can train a regression or time-series model for arrival prediction, while this same decision layer converts predictions into counter, stock and crowd-management actions.</p></div></div></div>'}
function renderArchitecture(){const el=document.getElementById('view-architecture');el.innerHTML='<div class="section-head" style="margin-top:0"><div><h2>Five-layer operating architecture</h2><p>Click a layer to expand its role.</p></div><span class="badge info">Modular design</span></div><div class="grid g2"><div class="card"><div class="layers">'+[['01','Input layer','Queue, arrivals, food, rate and counter status.','Accepts manual inputs in this demo. A production version can take camera counts, POS events, entry sensors, timetables or staff input.'],['02','Data processing','Validation, cleanup and normalization.','Checks raw values, converts them into consistent units and prepares clean variables for forecasting.'],['03','Prediction engine','Demand, queue growth and risk prediction.','This working model uses deterministic equations. Historical data can later power regression, time-series or classification models here.'],['04','Decision engine','Counter and stock recommendations.','Converts predictions into operational decisions: staffing, food preparation and risk classification.'],['05','Staff output UI','Clear actions, status and explanation.','Displays risk, wait time, counter actions, stock deficit, charts and plain-language reasoning.']].map((x,i)=>'<div class="layer '+(i===0?'active':'')+'"><div class="ln">'+x[0]+'</div><div><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div><div>›</div></div><div class="layer-detail">'+x[3]+'</div>').join('')+'</div></div><div><div class="card"><div class="title">Data flow</div><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px"><div class="notice">Queue + arrival + stock + service inputs</div><div style="text-align:center;color:var(--muted)">↓</div><div class="notice">Validation & normalization</div><div style="text-align:center;color:var(--muted)">↓</div><div class="notice">Forecast + risk classification</div><div style="text-align:center;color:var(--muted)">↓</div><div class="notice">Counter + food + wait-time decisions</div><div style="text-align:center;color:var(--muted)">↓</div><div class="notice">Dashboard + analytics + explanation</div></div></div><div class="card" style="margin-top:16px"><div class="title">Backend-ready structure</div><p class="sub" style="line-height:1.7">The interface is deliberately separated from the simulation logic. Later, the local <code>simulate()</code> function can be replaced by an API call to Python, Node, Flask, FastAPI or another backend without changing the visual interface.</p></div></div></div>';document.querySelectorAll('#view-architecture .layer').forEach(l=>l.onclick=()=>{document.querySelectorAll('#view-architecture .layer').forEach(x=>x.classList.remove('active'));l.classList.add('active')})}
function renderSettings(){const s=settings(),el=document.getElementById('view-settings');el.innerHTML='<div class="section-head" style="margin-top:0"><div><h2>Forecast preferences</h2><p>Saved locally on this device.</p></div></div><div class="grid g2"><div class="card"><div class="title">Model behavior</div><div class="setting"><div><strong>Auto-update forecast</strong><p>Recalculate while sliders move.</p></div><div id="autoToggle" class="toggle '+(s.autoRun?'on':'')+'"></div></div><div class="setting"><div><strong>High-risk threshold</strong><p>Multiplier applied to current service capacity.</p></div><select id="riskSelect"><option value="1.2">1.20×</option><option value="1.3">1.30×</option><option value="1.4">1.40×</option><option value="1.5">1.50×</option></select></div><div class="setting"><div><strong>Target wait time</strong><p>Presentation target for operations.</p></div><select id="waitSelect"><option value="5">5 min</option><option value="8">8 min</option><option value="10">10 min</option><option value="12">12 min</option></select></div></div><div class="card"><div class="title">Data & reset</div><div class="setting"><div><strong>Saved forecast history</strong><p>'+history().length+' run(s) stored.</p></div><button id="clearRuns" class="danger">Clear</button></div><div class="setting"><div><strong>Reset model settings</strong><p>Restore QueueMind defaults.</p></div><button id="resetSettings" class="btn2">Reset defaults</button></div><div class="notice" style="margin-top:16px">This HTML version is completely self-contained and does not upload any data. It can be opened directly from your computer.</div></div></div>';const rs=document.getElementById('riskSelect'),ws=document.getElementById('waitSelect'),at=document.getElementById('autoToggle');rs.value=s.riskMultiplier;ws.value=s.targetWait;rs.onchange=()=>{saveSettings({riskMultiplier:+rs.value});toast('Risk threshold updated')};ws.onchange=()=>{saveSettings({targetWait:+ws.value});toast('Target wait updated')};at.onclick=()=>{at.classList.toggle('on');saveSettings({autoRun:at.classList.contains('on')});toast('Preference saved')};document.getElementById('clearRuns').onclick=()=>{LS.set('qm-history',[]);renderSettings();toast('History cleared')};document.getElementById('resetSettings').onclick=()=>{LS.set('qm-settings',{});renderSettings();toast('Defaults restored')}}
nav();renderForecast();renderArchitecture();show('overview');
})();
</script>
